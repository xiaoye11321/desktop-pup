<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面萌宠</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="pet-stage">
      <button class="dog" id="dog" type="button" aria-label="桌面萌宠">
        <span class="ground-shadow"></span>
        <span class="pup">
          <span class="tail"><span></span></span>
          <span class="body"><span class="spot spot-large"></span><span class="spot spot-small"></span></span>
          <span class="leg rear-leg"></span>
          <span class="leg front-leg"></span>
          <span class="head">
            <span class="ear ear-left"></span>
            <span class="ear ear-right"></span>
            <span class="face">
              <span class="eye eye-left"></span><span class="eye eye-right"></span>
              <span class="muzzle"><span class="nose"></span><span class="mouth"></span><span class="tongue"></span></span>
              <span class="blush blush-left"></span><span class="blush blush-right"></span>
            </span>
          </span>
          <span class="sparkle sparkle-one"></span><span class="sparkle sparkle-two"></span>
        </span>
      </button>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
